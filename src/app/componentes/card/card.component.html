<div class="card" style="width: 100%;">
  <div 
    [ngClass]="{
    'card text-white bg-primary mb-3': flag && !cardData.foiFeita,
    'card bg-warning mb-3': !flag && !cardData.foiFeita,
    'card bg-secondary text-white mb-3 card-disabled': cardData.foiFeita
  }"
  >
    <div class="card-body">
      <h4 class="card-title">Ref:{{cardData.pacoteReferencia}}-{{cardData.produtoDescricao}}</h4>
      Tit:{{cardData.tituloCupom}}<br>
      Seq:{{cardData.sequencia}}<br>
      Qtd:{{ cardData.quantidade }}<br>
      Tempo:{{ cardData.tempoTotal }}<br>
      Funcionário:{{cardData.funcionario}}<br>

      <button 
        [disabled]="cardData.foiFeita" 
        type="button" 
        [ngClass]="flag ? 'btn btn-warning' : 'btn btn-danger'"
        (click)="AlterarCard()"
      >
        {{nomeDoBotao}}
      </button>
    </div>
  </div>
</div>
